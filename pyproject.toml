[project]
name = "hatkalkani"
version = "0.1.0"
description = "Elektrik hatlarindan kaynaklanan orman yangini riski icin hat parcasi duzeyinde karar destek araci"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.9",
    "pyproj>=3.6",
    "rasterio>=1.4",
    "rioxarray>=0.17",
    "xarray>=2024.6",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "scipy>=1.13",
    "pystac-client>=0.8",
    "odc-stac>=0.3.9",
    "duckdb>=1.1",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "tqdm>=4.66",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hatkalkani"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: ag erisimi gerektiren testler (varsayilan calistirmada atlanir)",
]
